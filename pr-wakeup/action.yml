name: Codeq8 PR wakeup
description: Report pull request lifecycle events to the Codeq8 backend for autonomous thread wakeups.

inputs:
  github_token:
    description: GitHub Actions token for the repository that emitted the PR event.
    required: true
  pull_request_number:
    description: Optional pull request number for manual workflow_dispatch runs.
    required: false
    default: ""
  head_sha:
    description: Optional pull request head SHA for manual workflow_dispatch runs.
    required: false
    default: ""
  conclusion:
    description: Optional workflow conclusion for manual workflow_dispatch runs.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Report PR wakeup
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        CODEQ8_WAKEUP_PULL_REQUEST_NUMBER: ${{ inputs.pull_request_number }}
        CODEQ8_WAKEUP_HEAD_SHA: ${{ inputs.head_sha }}
        CODEQ8_WAKEUP_CONCLUSION: ${{ inputs.conclusion }}
      run: |
        set -euo pipefail

        if ! command -v node >/dev/null 2>&1; then
          echo "::error::Node.js is required to run Codeq8 PR wakeup."
          exit 1
        fi

        codeq8_action_repo_root="$(cd "$GITHUB_ACTION_PATH/.." && pwd)"
        node "$codeq8_action_repo_root/scripts/github-actions-pr-wakeup.mjs"
