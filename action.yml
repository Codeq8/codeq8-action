name: Codeq8 Web Chat Run
description: Run the shared Codeq8 GitHub Actions web chat bridge inside a checked-out target workspace.

inputs:
  github_token:
    description: GitHub token available to the runner for repository operations.
    required: true

runs:
  using: composite
  steps:
    - name: Prepare Codeq8 action runtime
      shell: bash
      env:
        NODE_OPTIONS: ""
      run: |
        set -euo pipefail

        if ! command -v node >/dev/null 2>&1; then
          echo "::error::node is required on the self-hosted runner."
          exit 1
        fi
        codeq8_action_repo_root="$(cd "$GITHUB_ACTION_PATH" && pwd)"
        machine_path="${PATH}"
        npm_global_prefix="${HOME}/.npm-global"
        chrome_for_testing_bin_path="${HOME}/.cache/codeq8/chrome-for-testing-bin"
        playwright_browsers_path="${HOME}/.cache/codeq8/ms-playwright"
        mkdir -p "${npm_global_prefix}/bin"
        mkdir -p "${chrome_for_testing_bin_path}"
        mkdir -p "${playwright_browsers_path}"
        export CODEQ8_MACHINE_PATH="${machine_path}"
        export CODEQ8_CHROME_FOR_TESTING_BIN_PATH="${chrome_for_testing_bin_path}"
        export NPM_CONFIG_PREFIX="${npm_global_prefix}"
        export PLAYWRIGHT_BROWSERS_PATH="${playwright_browsers_path}"
        export PATH="${chrome_for_testing_bin_path}:${npm_global_prefix}/bin:${PATH}"
        echo "CODEQ8_MACHINE_PATH=${machine_path}" >> "$GITHUB_ENV"
        echo "CODEQ8_CHROME_FOR_TESTING_BIN_PATH=${chrome_for_testing_bin_path}" >> "$GITHUB_ENV"
        echo "NPM_CONFIG_PREFIX=${npm_global_prefix}" >> "$GITHUB_ENV"
        echo "PLAYWRIGHT_BROWSERS_PATH=${playwright_browsers_path}" >> "$GITHUB_ENV"
        echo "${chrome_for_testing_bin_path}" >> "$GITHUB_PATH"
        echo "${npm_global_prefix}/bin" >> "$GITHUB_PATH"

        runtime_assignments="$(
          node "$codeq8_action_repo_root/scripts/resolve-workspace-node-runtime.mjs" \
            --workspace-path "$codeq8_action_repo_root" \
            --format shell
        )"
        eval "$runtime_assignments"
        resolved_node_dir="$(dirname "$CODEQ8_RESOLVED_NODE_BIN")"
        export PATH="$resolved_node_dir:$PATH"
        echo "$resolved_node_dir" >> "$GITHUB_PATH"
        echo "NODE=$CODEQ8_RESOLVED_NODE_BIN" >> "$GITHUB_ENV"
        echo "CODEQ8_ACTION_REPO_ROOT=$codeq8_action_repo_root" >> "$GITHUB_ENV"

        if ! command -v git >/dev/null 2>&1; then
          echo "::error::git is required on the self-hosted runner."
          exit 1
        fi
        if ! command -v npm >/dev/null 2>&1 && [ ! -x "$resolved_node_dir/npm" ]; then
          echo "::error::npm is required on the self-hosted runner."
          exit 1
        fi
        if ! command -v curl >/dev/null 2>&1; then
          echo "::error::curl is required on the self-hosted runner."
          exit 1
        fi

        npm_bin="$(command -v npm || true)"
        if [ -z "$npm_bin" ] && [ -x "$resolved_node_dir/npm" ]; then
          npm_bin="$resolved_node_dir/npm"
        fi
        if [ -z "$npm_bin" ]; then
          echo "::error::npm is required on the self-hosted runner."
          exit 1
        fi

        "$CODEQ8_RESOLVED_NODE_BIN" --version
        "$npm_bin" --version
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/ensure-codeq8-action-runtime.mjs" \
          --repo-root "$codeq8_action_repo_root" \
          --node-path "$CODEQ8_RESOLVED_NODE_BIN" \
          --npm-path "$npm_bin"
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/install-codeq8-plugin.mjs" \
          --repo-root "$codeq8_action_repo_root"
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/prepare-codeq8-python-tools.mjs" \
          --repo-root "$codeq8_action_repo_root"
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/runner-global-cli-tools.mjs"
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/prepare-codeq8-playwright-mcp.mjs" \
          --repo-root "$codeq8_action_repo_root"
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/prepare-codeq8-playwright-mcp.mjs" \
          --repo-root "$codeq8_action_repo_root" \
          --marker-file "~/.cache/codeq8/playwright-mcp-browser-default.json" \
          --default-browser-cache
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/sync-codeq8-playwright-mcp-config.mjs" \
          --repo-root "$codeq8_action_repo_root"
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/sync-workspace-mcp-config.mjs" \
          --repo-root "$codeq8_action_repo_root" \
          --workspace-path "${GITHUB_WORKSPACE:-}"
        "$CODEQ8_RESOLVED_NODE_BIN" "$codeq8_action_repo_root/scripts/prepare-workspace-playwright-mcp.mjs" \
          --workspace-path "${GITHUB_WORKSPACE:-}"

        if command -v gh >/dev/null 2>&1; then
          real_gh_path="$(command -v gh)"
          gh_wrapper_dir="${RUNNER_TEMP:-/tmp}/codeq8-gh-wrapper-${GITHUB_RUN_ID:-run}-${GITHUB_RUN_ATTEMPT:-0}"
          mkdir -p "$gh_wrapper_dir"
          {
            echo '#!/usr/bin/env bash'
            echo 'set -euo pipefail'
            printf 'real_gh_path=%q\n' "$real_gh_path"
            cat <<'GH_WRAPPER'
        resolve_gh_api_endpoint_argument() {
          local expect_endpoint=0
          local skip_next=0
          local arg
          for arg in "$@"; do
            if [ "$expect_endpoint" -eq 0 ]; then
              [ "$arg" = "api" ] || continue
              expect_endpoint=1
              continue
            fi
            if [ "$skip_next" -eq 1 ]; then
              skip_next=0
              continue
            fi
            case "$arg" in
              --method|-X|--header|-H|--field|-f|--raw-field|-F|--input|--jq|--template)
                skip_next=1
                continue
                ;;
              --method=*|-X*|--header=*|-H*|--field=*|-f*|--raw-field=*|-F*|--input=*|--jq=*|--template=*)
                continue
                ;;
              --*|-*)
                continue
                ;;
            esac
            printf "%s\n" "$arg"
            return 0
          done
          return 1
        }

        resolve_gh_api_method_argument() {
          local expect_method=0
          local method="GET"
          local arg
          for arg in "$@"; do
            if [ "$expect_method" -eq 1 ]; then
              method="$arg"
              expect_method=0
              continue
            fi
            case "$arg" in
              --method|-X)
                expect_method=1
                ;;
              --method=*)
                method="${arg#--method=}"
                ;;
              -X=*)
                method="${arg#-X=}"
                ;;
              -X?*)
                method="${arg#-X}"
                ;;
            esac
          done
          method="$(printf "%s" "$method" | tr "[:lower:]" "[:upper:]")"
          printf "%s\n" "${method:-GET}"
        }

        gh_api_has_mutation_payload_flag() {
          local arg
          for arg in "$@"; do
            case "$arg" in
              --field|-f|--raw-field|-F|--input|--field=*|-f*|--raw-field=*|-F*|--input=*)
                return 0
                ;;
            esac
          done
          return 1
        }

        if [ "${1:-}" = "auth" ] && [ "${2:-}" = "setup-git" ]; then
          echo "::error::Codeq8 runner git auth is owned by the scoped credential helper; do not run gh auth setup-git as a push fallback." >&2
          exit 1
        fi

        endpoint="$(resolve_gh_api_endpoint_argument "$@" || true)"
        if [ -n "$endpoint" ]; then
          endpoint="${endpoint#https://api.github.com/}"
          endpoint="${endpoint#http://api.github.com/}"
          endpoint="${endpoint#api.github.com/}"
          endpoint="${endpoint#/}"
          case "$endpoint" in
            repos/*/*/git/blobs*|repos/*/*/git/trees*|repos/*/*/git/commits*|repos/*/*/git/refs*|repos/*/*/git/ref*)
              method="$(resolve_gh_api_method_argument "$@")"
              if [ "$method" != "GET" ] || gh_api_has_mutation_payload_flag "$@"; then
                echo "::error::Git database write fallback is not allowed for branch publishing; fix the Codeq8 Git credential helper and use git push." >&2
                exit 1
              fi
              ;;
          esac
        fi

        exec "$real_gh_path" "$@"
        GH_WRAPPER
          } > "$gh_wrapper_dir/gh"
          chmod 700 "$gh_wrapper_dir/gh"
          echo "$gh_wrapper_dir" >> "$GITHUB_PATH"
        fi

    - name: Run Codeq8 chat bridge
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        NODE_OPTIONS: ""
      run: |
        set -euo pipefail

        "$NODE" "$CODEQ8_ACTION_REPO_ROOT/scripts/github-actions-web-chat-runner-bridge.mjs"
